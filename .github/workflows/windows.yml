name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          python -m pip install --quiet uv==0.13.1
          choco install ffmpeg -y --no-progress
      - name: Unit tests
        run: |
          uv sync --frozen
          uv run pytest

  install:
    # What a user does: extract the release zip into a folder whose name has
    # a space and an accent, run the installer, open the app, and run the
    # whole enroll -> transcribe -> review -> learn cycle with what it installed.
    runs-on: windows-latest
    needs: unit
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build the release zip
        run: python tools/build_release.py
      - name: Extract it like a user would
        shell: pwsh
        run: |
          $dest = Join-Path $env:USERPROFILE 'Downloads\Teste Instalação'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -LiteralPath (Get-Item dist\Notarius-*.zip).FullName -DestinationPath $dest
          "INSTALL_DIR=$((Get-ChildItem -LiteralPath $dest -Directory)[0].FullName)" >> $env:GITHUB_ENV
      - name: Restore downloaded models
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Notarius\models
          key: models-${{ hashFiles('src/notarius/config.py', 'src/notarius/tuning.py') }}
      - name: Run the installer (Windows PowerShell 5.1, as on a user's machine)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "%INSTALL_DIR%\app\windows\install.ps1" -Unattended
      - name: Check what was installed
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'Notarius'
          foreach ($p in 'env\Scripts\python.exe', 'ffmpeg\ffmpeg.exe', 'ffmpeg\ffprobe.exe',
                         'models\ready', 'tuning.json') {
            if (-not (Test-Path (Join-Path $root $p))) { throw "missing $p" }
          }
          Get-Content (Join-Path $root 'tuning.json')
          foreach ($lnk in "$([Environment]::GetFolderPath('DesktopDirectory'))\Notarius.lnk",
                           "$([Environment]::GetFolderPath('Programs'))\Notarius\Notarius.lnk") {
            if (-not (Test-Path $lnk)) { throw "missing shortcut $lnk" }
          }
      - name: The app starts and answers
        shell: pwsh
        run: |
          $py = Join-Path $env:LOCALAPPDATA 'Notarius\env\Scripts\python.exe'
          $app = Start-Process -FilePath $py -ArgumentList '-m','notarius','app','--no-browser','--port','47999' -PassThru -RedirectStandardOutput app.log -RedirectStandardError app.err
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-RestMethod http://127.0.0.1:47999/api/ping; if ($r.app -eq 'notarius') { $ok = $true; break } } catch { Start-Sleep 1 }
          }
          if (-not $ok) { Get-Content app.log, app.err; throw 'app did not answer' }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:47999/
          if ($page.Content -notmatch 'notarius-token') { throw 'page missing' }
          Stop-Process -Id $app.Id
      - name: End-to-end cycle with the installed program
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'Notarius'
          $py = Join-Path $root 'env\Scripts\python.exe'
          & (Join-Path $root 'bin\uv.exe') pip install --python $py --quiet pytest
          $env:HF_HOME = Join-Path $root 'models\huggingface'
          $env:PYANNOTE_CACHE = Join-Path $root 'models\pyannote'
          $env:HF_HUB_OFFLINE = '1'
          $env:PATH = (Join-Path $root 'ffmpeg') + ';' + $env:PATH
          # Only the model setup chose for this machine is downloaded.
          $env:NOTARIUS_TEST_MODEL = (Get-Content (Join-Path $root 'tuning.json') | ConvertFrom-Json).whisper_model
          & $py -m pytest tests -m slow -p no:cacheprovider -rA
          if ($LASTEXITCODE -ne 0) { throw 'end-to-end tests failed' }
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs
          path: |
            ~\AppData\Local\Notarius\instalacao.log
            ~\AppData\Local\Notarius\tuning.json
            app.log
            app.err
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/build_release.py
          gh release create "$GITHUB_REF_NAME" dist/Notarius-*.zip --title "Notarius $GITHUB_REF_NAME" --notes-file CHANGELOG.md
